<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Fabulari</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Neucha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="centered-layout">
        <div class="torn-notepad" style="max-width: 450px;">
            <h1 class="text-center" style="font-size: 3.5rem; margin-bottom: 2rem;">Log In</h1>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Secret password" required>
                </div>
                
                <div class="text-center mt-2">
                    <button type="submit" class="btn btn-accent-blue" style="font-size: 1.5rem; padding: 0.75rem 2rem; width: 100%;">Log In</button>
                </div>

                <div class="text-center" style="margin-top: 2rem;">
                    <a href="signup.html" class="sketch-link">Need a new page? Sign up here.</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
