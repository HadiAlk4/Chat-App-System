<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Fabulari</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Neucha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="centered-layout">
        <div class="torn-notepad">
            <h1 class="text-center" style="font-size: 4rem; margin-bottom: 2rem;">Join Fabulari</h1>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="input-field" placeholder="e.g. SketchyArtist99" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <div class="form-hint">Cannot be changed later</div>
                    <input type="email" id="email" class="input-field" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="form-hint">Min 8 chars, 1 uppercase, alphanumeric</div>
                    <input type="password" id="password" class="input-field" placeholder="Secret password" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="dob">Age/Date of Birth</label>
                    <input type="date" id="dob" class="input-field" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Profile Doodle</label>
                    <div class="file-upload">
                        Attach Profile Doodle <br>
                        <span style="font-size: 0.9rem; font-family: 'Caveat';">(Click or Drag & Drop)</span>
                    </div>
                </div>

                <label class="toggle-group">
                    <input type="checkbox" class="toggle-checkbox">
                    <span>Dark mode ink wash preference</span>
                </label>
                
                <div class="text-center mt-2">
                    <button type="submit" class="btn btn-accent-blue" style="font-size: 1.5rem; padding: 0.75rem 2rem; width: 100%;">Register Account</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
