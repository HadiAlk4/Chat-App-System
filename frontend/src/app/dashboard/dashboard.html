
<div class="row">
    <aside>
        <div class="torn-notepad">
            @if ( userRole === 'super-admin')
            {
                <p> S </p>
            } 
            @else if (userRole === 'group-admin')
            {
                <p> A </p>
            }
            @else if (userRole === 'user')
            {
                <p> U </p>
            }
        </div>
        <p> name : {{username}} </p>

    </aside>

    <div> 
    <div class="row" style="gap: 3rem">
    <h2 style="margin: 1"> Available Groups </h2>
    <button class="btn-success">Propose New Chat Room</button>
    </div>

    <div class="row" style="gap: 1.5rem">
        @for (group of availableGroups; track group.name) 
        {
            <div class="card" style="width: 20rem; color: grey; background-color: rgb(245, 242, 242); " >
                  <div class="card-body">
                    <h4 class="card-title"> {{ group.name }}</h4>
                    <h5 class="card-subtitle"> Minimum Age: {{ group.minAge }}</h5>
                    <p class="card-text"> {{ group.description }} </p>
                    <button class="btn-primary">Request to Join</button>
                  </div>
            </div>
        }
    </div>
    </div>
</div>
