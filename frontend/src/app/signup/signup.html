<div class="centered-layout">      
    <div class="torn-notepad">
        <h1 class="text-center" style="font-size: 3.5rem; margin-bottom: 2rem;">Join Fabulari</h1>

        @if (isFirstUser()) {
            <p class="text-center" style="margin-top: -1rem; margin-bottom: 1.5rem;">
                <small>No accounts exist yet, so you are signing up as the Super Admin.</small>
            </p>
        }

        <div class="form-group">          
        <label for="regUsername"> Username </label>         
        <input class="input-block" type="text" placeholder="e.g. hadialk04" id="regUsername" [(ngModel)]="usernameInput">          
        </div>         

        <div class="form-group">          
        <label for="regEmail"> Email </label>         
        <div>         
        <small> Cannot be changed later</small>         
        </div>         
        <input class="input-block" type="email" placeholder="your@email.com" id="regEmail" [(ngModel)]="emailInput">          
        </div>         

        <div class="form-group">          
        <label for="regPassword"> Password </label>         
        <div>         
        <small> Min 8 chars, 1 uppercase, alphanumeric</small>         
        </div>         
        <input class="input-block" type="password" placeholder="your secret password" id="regPassword" [(ngModel)]="passwordInput" (keyup.enter)="registerUser()">          
        </div>         

        <div class="form-group">         
        <label for="dob">Age/Date of Birth</label>         
        <input type="date" id="dob" class="input-block" [(ngModel)]="dobInput" required>         
        </div>         

        <div class="form-group">         
        <label class="form-label" for="regDoodle">Profile Doodle</label>         
        <label class="file-upload" for="regDoodle" style="display: block;">         
        {{ selectedFileName() || 'Attach Profile Doodle' }}         
        </label>         
        <input type="file" id="regDoodle" accept="image/*" (change)="onFileSelected($event)" style="display: none;">         
        </div>         

        @if (errorMessage()) {
            <div class="alert alert-danger" role="alert" style="margin-bottom: 1rem;">
                {{ errorMessage() }}
            </div>
        }

        <button class="btn-secondary btn-block" (click)="registerUser()">Sign Up</button>     

        <div class="text-center" style="margin-top: 1.5rem;">
        <a routerLink="/login" style="color: rgb(144, 144, 242); text-decoration: none;">
        Already a Member?
        </a>
        </div>
    </div> 
</div>
