<div>
    <div style="gap: 3rem; text-align: center; margin-bottom: 2rem; margin-top: 1rem;">
        <h2 style="margin: 0"> Account Settings </h2>
        <p style="font-size: 1.2rem; font-weight: bold; margin-top: 0.5rem;">
            UserName: {{ userProfile.username }}
            <button routerLink="/dashboard" class="btn-success-outline">DashBoard</button>
        </p>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2rem; padding: 0 3rem 3rem 3rem;">
        <div class="paper container-xs" style="margin: 0; width: 100%; height: 100%;">
            <h3 style="margin-top: 0;">Account Details</h3>
            <div class="form-group">
                <label>Email Address (Unique ID)</label>
                <input class="input-block" type="email" [value]="userProfile.email" disabled>
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input class="input-block" type="date" [value]="userProfile.dob" disabled>
            </div>
            <div class="form-group">
                <label>System Role</label>
                <input class="input-block" type="text" [value]="userProfile.role" disabled>
            </div>
            <button routerLink="/my-memberships" class="btn-warning btn-block" style="margin-top: 1rem;">My Memberships</button>
        </div>

        <div style="padding: 1rem; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h3 style="margin-top: 0;">Identity & Preferences</h3>
                <div class="form-group">
                    <label for="usernameInput">Display Name</label>
                    <div style="display: flex; gap: 1rem;">
                        <input type="text" id="usernameInput" [(ngModel)]="userProfile.username" style="flex: 1;">
                        <button class="btn-secondary" style="margin: 0;">Save</button>
                    </div>
                </div>
                <fieldset class="form-group" style="margin-top: 2rem; display: flex; align-items: center; gap: 1rem;">
                    <label for="paperSwitch5" class="paper-switch-label" style="margin: 0; font-weight: bold;">
                        Dark Mode Theme
                    </label>
                    <label class="paper-switch" style="margin: 0;">
                        <input id="paperSwitch5" name="paperSwitch5" type="checkbox" [(ngModel)]="userProfile.isDarkMode" />
                        <span class="paper-switch-slider"></span>
                    </label>
                </fieldset>
                <p>* Just for the Chat Screen</p>
            </div>
            <div style="border-top: 2px dashed #a56969; padding-top: 1.5rem; margin-top: 1.5rem;">
                @if (isSuperAdmin) {
                    <p style="margin: 0; color: #777;">Super Admin cannot request account deletion.</p>
                } @else {
                    <button class="btn-danger btn-block" (click)="requestAccountDeletion()">Request Account Deletion</button>
                }
            </div>
        </div>

        <!-- PROFILE DOODLE UPLOAD -->
        <div style="padding: 1rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <h3 style="margin-top: 0;">Profile Doodle</h3>
            <img [src]="doodleSrc" alt="Profile Doodle" style="width: 160px; height: 160px; border: 3px solid #222; border-radius: 12px; margin-bottom: 1rem; object-fit: cover;">
            <p style="margin-bottom: 1rem;">Want to change your look?<br>Upload a new doodle below (Max 2MB).</p>

            <div class="form-group" style="width: 80%;">
                <input type="file" id="doodleUpload" class="input-block" accept="image/*" (change)="onFileSelected($event)">
            </div>
            <button class="btn-secondary" style="width: 80%;" [disabled]="!selectedFile" (click)="uploadDoodle()">
                Upload New Doodle
            </button>
        </div>

        <div class="paper container-xs" style="margin: 0; width: 100%; height: 100%;">
            <h3 style="margin-top: 0;">Security</h3>
            <div class="form-group">
                <label for="oldPass">Current Password</label>
                <input type="password" id="oldPass" class="input-block" placeholder="Verify current password" [(ngModel)]="currentPasswordInput">
            </div>
            <div class="form-group">
                <label for="newPass">New Password</label>
                <input type="password" id="newPass" class="input-block" placeholder="Min 8 chars, 1 uppercase" [(ngModel)]="newPasswordInput">
            </div>
            <div class="form-group">
                <label for="confirmPass">Confirm New Password</label>
                <input type="password" id="confirmPass" class="input-block" placeholder="Retype new password" [(ngModel)]="confirmPasswordInput">
            </div>
            <button class="btn-success btn-block" style="margin-top: 1.5rem;">Save New Password</button>
        </div>
    </div>
</div>
