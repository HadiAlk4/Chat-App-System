<div class="row" style="display: flex;"> 

<aside>
        <div style="flex: 1; margin-top: 3rem; padding-left: 5rem;">
            <div class="torn-notepad">
                <p class="text-danger"> S </p>
            </div>
            <h3 style=" font-size: 1.5rem;"> Name : {{userName}} </h3>
            <p style="font-size: 1.5rem;" class="text-danger">Role: Super-Admin</p>

            <div style="display: flex; flex-direction: column; gap: 0.8rem; ">
                <!-- <button class="btn-block btn-warning-outline">Explore Groups</button> -->
                <!-- <button routerLink="/super-admin-dashboard" class="btn-block btn-success-outline"> Super-Admin Dashboard </button> -->
                <button routerLink="/super-admin-dashboard" class="btn-block btn-secondary-outline"> Super Admin Dashboard </button>
                <button (click)="onLogout()" class="btn-danger btn-block" style="margin-top: 2rem;"> Log Out </button>
            </div>
        </div>
</aside>

<div style="display: flex; flex: 9; flex-direction: column; align-items: center; gap: 1rem; margin-top: 5%; margin-left: 2%; margin-right: 2%;" class="paper container container-lg">
    <div style="gap: 3rem; text-align: center; margin-bottom: 1rem; ">
    <h2 style="margin: 0"> Super Admin Audit Log </h2>
    </div>

    <div style="display: flex; gap: 1rem; align-items: center; width: 100%;">
        <input type="date" [(ngModel)]="startDate">
        <span> to </span>
        <input type="date" [(ngModel)]="endDate">
        
        <select [(ngModel)]="selectedAction" style="flex: 1;">
            @for(action of actionTypes; track action)
            {
                <option [value]="action">{{action}} </option>
            }
        </select>
        <button (click)="applyFilters()"> Apply </button>
    </div>




<table class="table-hover">
  <thead>
    <tr>
      <th>#</th>
      <th>Timestamp</th>
      <th>Action Performed</th>
      <th>Target ID</th>
    </tr>
    </thead>
  <tbody>
    @for(req of displayedAuditLog; track req._id ?? $index)
    {
    <tr>
        <td> {{ $index + 1}} </td>
        <td> {{ req.timeStamp | date:'short' }} </td>
        <td> {{ req.actionPerformed }} </td>
        <td> {{ req.target }}</td>
    </tr>
    } @empty {
    <tr>
        <td colspan="4">No audit records.</td>
    </tr>
    }
  </tbody>
</table>
    

</div>

</div>
